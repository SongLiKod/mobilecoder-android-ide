name: Build & Test Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v1.2.0）。留空则仅构建上传 artifact，不打 Release。'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK & CMake
        env:
          NDK_VERSION: 26.3.11579264
          CMAKE_VERSION: 3.22.1
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured, skipping release signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/mobilecoder-keystore.jks
          cat > app/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile rootProject.file("app/mobilecoder-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          printf '\napply(from = "signing.gradle")\n' >> app/build.gradle.kts

      - name: Build APK
        env:
          ANDROID_KEYSTORE: app/mobilecoder-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobilecoder-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="true"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p upload
          echo "Downloaded artifact tree:"
          find dist-artifacts -type f -print
          mapfile -t FILES < <(find dist-artifacts -type f | sort)
          for SRC in "${FILES[@]}"; do
            BASE=$(basename "$SRC")
            case "$BASE" in
              *-unsigned.apk)
                DEST="upload/MobileCoder-${VERSION}-unsigned.apk"
                ;;
              app-release.apk|*-release.apk)
                DEST="upload/MobileCoder-${VERSION}.apk"
                ;;
              app-debug.apk|*-debug.apk)
                DEST="upload/MobileCoder-${VERSION}-debug.apk"
                ;;
              *)
                DEST="upload/$BASE"
                ;;
            esac
            cp "$SRC" "$DEST"
            echo "Prepared $DEST from $SRC"
          done
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
